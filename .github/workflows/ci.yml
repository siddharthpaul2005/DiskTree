name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      # Puts cl.exe (and VS's CMake/Ninja) on PATH for the Ninja generator
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ── Engine (C++) ─────────────────────────────────────────────
      - name: Configure engine
        run: cmake --preset release-static

      - name: Build engine
        run: cmake --build --preset release-static

      - name: Test engine
        run: ctest --preset release-static

      # ── Desktop app (TypeScript + Rust) ──────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Type-check and build UI
        working-directory: app
        run: npm run build

      - name: UI unit tests
        working-directory: app
        run: npm test

      - name: End-to-end tests (real engine + Edge)
        working-directory: app
        run: npx playwright test

      - name: Compile desktop shell
        working-directory: app
        run: |
          npm run sidecar
          cargo build --manifest-path src-tauri/Cargo.toml --release
