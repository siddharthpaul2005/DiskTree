name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ── Engine ───────────────────────────────────────────────────
      - name: Configure
        run: cmake --preset release-static

      - name: Build
        run: cmake --build --preset release-static

      - name: Test
        run: ctest --preset release-static

      # ── Desktop app ──────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: UI tests
        working-directory: app
        run: |
          npm test
          npx playwright test

      - name: Build installers
        working-directory: app
        run: |
          npm run sidecar
          npx tauri build

      # ── Collect artefacts ────────────────────────────────────────
      - name: Package
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\release\disktree.exe dist\disktree-windows-x64.exe
          Copy-Item (Get-ChildItem app\src-tauri\target\release\bundle\nsis\*-setup.exe | Select-Object -First 1).FullName "dist\DiskTree-$version-setup.exe"
          Copy-Item (Get-ChildItem app\src-tauri\target\release\bundle\msi\*.msi | Select-Object -First 1).FullName "dist\DiskTree-$version-x64.msi"
          Get-ChildItem dist | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "$($_.FullName).sha256" -Value $hash -NoNewline
          }
          Get-ChildItem dist

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
